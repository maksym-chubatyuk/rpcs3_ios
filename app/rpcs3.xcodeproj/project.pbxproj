			name = "Embed RPCS3 core";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# Embeds the emulator core (scripts/build-core-ios.sh; MoltenVK is linked into it) into the app and signs it.\n# The core is loaded with dlopen() at run time, so a missing one only disables emulation.\nDEST=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nmkdir -p \"$DEST\"\nSIGN=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\"\nembed() {\n  if [ -f \"$1/$(basename \"$1\" .framework)\" ]; then\n    rm -rf \"$DEST/$(basename \"$1\")\"\n    ditto \"$1\" \"$DEST/$(basename \"$1\")\"\n    codesign --force --sign \"$SIGN\" --timestamp=none \"$DEST/$(basename \"$1\")\"\n    echo \"embedded $(basename \"$1\")\"\n  else\n    echo \"warning: $1 not built yet; the app will run without it\"\n  fi\n}\nembed \"${PROJECT_DIR}/../build/core/ios/RPCS3Core.framework\"\n# StikJIT, for the JIT helper extension (it loads it from rpcs3.app/Frameworks). The framework ships\n# without the Info.plist an embedded framework needs.\nSTIK=\"$DEST/StikJIT.framework\"\nrm -rf \"$STIK\"\nditto \"${PROJECT_DIR}/../third_party/StikJIT/StikJIT.xcframework/ios-arm64/StikJIT.framework\" \"$STIK\"\nif [ ! -f \"$STIK/Info.plist\" ]; then\n  plutil -create binary1 \"$STIK/Info.plist\"\n  for kv in CFBundleExecutable=StikJIT CFBundleIdentifier=${PRODUCT_BUNDLE_IDENTIFIER}.StikJIT CFBundleName=StikJIT CFBundlePackageType=FMWK CFBundleInfoDictionaryVersion=6.0 CFBundleShortVersionString=1.9.0 CFBundleVersion=1 MinimumOSVersion=26.0; do\n    plutil -insert \"${kv%%=*}\" -string \"${kv#*=}\" \"$STIK/Info.plist\"\n  done\n  plutil -insert CFBundleSupportedPlatforms -json '[\"iPhoneOS\"]' \"$STIK/Info.plist\"\nfi\ncodesign --force --sign \"$SIGN\" --timestamp=none \"$STIK\"\n# RPCS3's overlay images (home menu, trophies); the core links rpcs3.app/Icons into its folder at launch\nrm -rf \"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Icons\"\nditto \"${PROJECT_DIR}/../rpcs3/bin/Icons\" \"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Icons\"\n";
		};
/* End PBXShellScriptBuildPhase section */

